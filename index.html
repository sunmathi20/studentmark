
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Mark Calculator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .container {
            width: 350px;
            margin: 50px auto;
            background-color: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            line-height: 1.8;
        }
    </style>
</head>

<body>

    <div class="container">

        <h2>Student Mark Calculator</h2>

        <input type="text" id="name" placeholder="Enter Student Name">

        <input type="number" id="mark1" placeholder="Tamil Mark">
        <input type="number" id="mark2" placeholder="English Mark">
        <input type="number" id="mark3" placeholder="Maths Mark">
        <input type="number" id="mark4" placeholder="Science Mark">
        <input type="number" id="mark5" placeholder="Social Mark">

        <button onclick="calculateMarks()">Calculate</button>

        <div id="result"></div>

    </div>


    <script>

        const calculateMarks = () => {

            let name = document.getElementById("name").value;

            let mark1 = Number(document.getElementById("mark1").value);
            let mark2 = Number(document.getElementById("mark2").value);
            let mark3 = Number(document.getElementById("mark3").value);
            let mark4 = Number(document.getElementById("mark4").value);
            let mark5 = Number(document.getElementById("mark5").value);

            let total = mark1 + mark2 + mark3 + mark4 + mark5;

            let average = total / 5;

            let result;

            if (mark1 >= 35 && mark2 >= 35 && mark3 >= 35 && mark4 >= 35 && mark5 >= 35) {
                result = "PASS";
            } else {
                result = "FAIL";
            }

            document.getElementById("result").innerHTML =
                "<h3>Result</h3>" +
                "Student Name: " + name + "<br>" +
                "Total Mark: " + total + " / 500<br>" +
                "Average: " + average + "<br>" +
                "Result: " + result;
        };

    </script>

</body>
</html>
